name: ccs_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # Architecture (mirror WAVTech)
  get: ^4.7.2
  dio: ^5.4.3+1
  get_storage: ^2.1.1
  flutter_secure_storage: ^9.0.0
  flutter_dotenv: ^6.0.0
  dropdown_button2: ^2.3.9
  flutter_typeahead: ^5.2.0

  # Platform + utilities
  connectivity_plus: ^7.0.0
  intl: ^0.20.2

  # UI
  google_fonts: ^6.2.1
  iconsax_plus: ^1.0.0
  table_calendar: ^3.1.2

  # Media / uploads (required by SRS: profile photo + job photos + documents)
  image_picker: ^1.1.1
  flutter_image_compress: ^2.4.0
  permission_handler: ^12.0.0+1


  # Toast notifications (WAVTech-style)
  toastification: ^3.0.2

  #Adaptive Theme
  adaptive_theme: ^3.7.2
  flutter_svg: ^2.2.3
  vector_graphics: ^1.1.19


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner:
  flutter_gen_runner:


flutter_gen:
  output: lib/app/gen/ # Optional (default: lib/gen/)
  line_length: 80 # Optional (default: 80)
  assets:
    outputs:
      style: camel-case
  # Optional
  integrations:
    image: true
    flutter_svg: true


flutter:

  uses-material-design: true

  assets:
    - assets/images/



get_cli:
  sub_folder: false
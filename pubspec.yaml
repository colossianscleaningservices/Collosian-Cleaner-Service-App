name: ccs_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Architecture (mirror WAVTech)
  get: ^4.7.2
  dio: ^5.4.3+1
  get_storage: ^2.1.1
  flutter_secure_storage: ^9.0.0
  flutter_dotenv: ^6.0.0
  dropdown_button2: ^2.3.9
  flutter_typeahead: ^5.2.0
  file_picker: ^10.1.9
  package_info_plus: ^8.0.0
  video_player: ^2.10.1
  step_progress: ^2.7.1
  url_launcher: ^6.3.2
  easy_pdf_viewer: ^1.0.8

  # Platform + utilities
  connectivity_plus: ^7.0.0
  intl: ^0.20.2

  # UI
  google_fonts: ^6.2.1
  iconsax_plus: ^1.0.0
  table_calendar: ^3.1.2

  # Media / uploads (required by SRS: profile photo + job photos + documents)
  image_picker: ^1.1.1
  emoji_picker_flutter: ^4.4.0
  flutter_image_compress: ^2.4.0
  permission_handler: ^12.0.0+1


  # Toast notifications (WAVTech-style)
  toastification: ^3.0.2

  #Adaptive Theme
  adaptive_theme: ^3.7.2
  flutter_svg: ^2.2.3
  vector_graphics: ^1.1.19

  onesignal_flutter: ^5.3.4

  # Firebase (analytics, crashlytics; auth is API-based)
  firebase_core: ^3.1.0
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.0.0
  flutter_native_splash: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  analyzer: ^9.0.0
  build_runner: ^2.4.8
  change_app_package_name: ^1.1.0
  flutter_gen_runner: ^5.4.0
  flutter_launcher_icons: ^0.14.2
  rename_app: ^1.6.1


flutter_gen:
  output: lib/app/gen/ # Optional (default: lib/gen/)
  line_length: 80 # Optional (default: 80)
  assets:
    outputs:
      style: camel-case
  # Optional
  integrations:
    image: true
    flutter_svg: true


flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/launcher/

flutter_native_splash:
  ios: true
  android: true
  #  web: true

  color: "#FFFFFF"
  image: "assets/launcher/app_icon_fg.png"

  android_12:
    image: "assets/launcher/app_icon_fg.png"
    color: "#FFFFFF"
    icon_background_color: "#FFFFFF"


flutter_launcher_icons:
  ios: true
  android: true

  image_path_ios: "assets/launcher/app_icon.png"
  image_path_android: "assets/launcher/app_icon.png"

  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/launcher/app_icon_fg.png"


get_cli:
  sub_folder: false
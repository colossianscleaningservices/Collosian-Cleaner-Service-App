name: ccs_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7


dependencies:
  flutter:
    sdk: flutter

  # Architecture (mirror WAVTech)
  get: ^4.7.2
  dio: ^5.4.3+1
  get_storage: ^2.1.1
  flutter_secure_storage: ^9.0.0
  flutter_dotenv: ^6.0.0
  dropdown_button2: ^2.3.9
  flutter_typeahead: ^5.2.0

  # Platform + utilities
  connectivity_plus: ^7.0.0
  intl: ^0.20.2

  # UI
  google_fonts: ^6.2.1
  iconsax_plus: ^1.0.0
  table_calendar: ^3.1.2

  # Media / uploads (required by SRS: profile photo + job photos + documents)
  image_picker: ^1.1.1
  flutter_image_compress: ^2.4.0
  permission_handler: ^12.0.0+1


  # Toast notifications (WAVTech-style)
  toastification: ^3.0.2

  #Adaptive Theme
  adaptive_theme: ^3.7.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Italic.ttf
  #         weight: 700

get_cli:
  sub_folder: false